<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#702b49"><meta name="description" content="Nora Libas product details">
<title>Product Details | Nora Libas</title>
<style>
:root{--wine:#702b49;--soft:#fff7f8;--line:#f0e5e9}*{box-sizing:border-box}
body{margin:0;color:#30252a;background:#fff;font-family:system-ui,"Noto Sans Bengali",sans-serif;-webkit-font-smoothing:antialiased}
.top{background:var(--wine);color:white;text-align:center;padding:8px 10px;font-size:12px}
.nav{height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff}
.logo{font:700 24px Georgia;color:var(--wine);text-decoration:none}
.wrap{max-width:980px;margin:auto;padding:14px}.back{color:var(--wine);text-decoration:none;font-size:14px;font-weight:700;display:inline-block;margin:8px 0 16px}
.layout{display:grid;gap:20px}.gallery{min-width:0}.main-image-wrap{position:relative;background:#faf4f6;border-radius:14px;overflow:hidden;touch-action:pan-y}
.main-image{display:block;width:100%;height:min(68vh,580px);object-fit:contain;cursor:zoom-in}
.image-count{position:absolute;right:12px;bottom:12px;background:#24171dbb;color:white;border-radius:20px;padding:6px 11px;font-size:12px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 4px}.thumb{width:64px;height:76px;flex:0 0 auto;object-fit:cover;border:2px solid transparent;border-radius:8px;cursor:pointer;background:#faf4f6}.thumb.active{border-color:var(--wine)}
.info{padding:2px}.name{font:700 28px Georgia;color:var(--wine);margin:0 0 10px}.desc{font-size:14px;line-height:1.7;color:#6f6268;white-space:pre-line}
.price{font-size:25px;color:var(--wine);font-weight:800;margin:14px 0 4px}.old{font-size:14px;color:#9b9296;text-decoration:line-through;font-weight:400;margin-left:8px}
.stock{display:inline-block;font-size:13px;font-weight:800;margin:8px 0 16px}.in{color:#16834a}.out{color:#c62828}
.card{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fffafb;margin-top:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;min-height:43px;border:1px solid #e5d9de;border-radius:9px;padding:10px;font:inherit;font-size:14px;background:white}.field.full{grid-column:1/-1}.field textarea{min-height:72px;resize:vertical}
.btn{display:inline-flex;justify-content:center;align-items:center;border:0;border-radius:25px;background:var(--wine);color:white;text-decoration:none;font-weight:700;padding:12px 18px;min-height:44px;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.whatsapp{background:#16834a}.actions{display:flex;gap:8px;margin-top:12px}.actions .btn{flex:1}
.total{display:flex;justify-content:space-between;background:#fbedf1;color:var(--wine);padding:11px;border-radius:9px;font-weight:800;margin:12px 0}
.note{font-size:11px;color:#81757a;line-height:1.5}.empty{text-align:center;padding:35px 15px;color:#777}.footer{text-align:center;color:#82757c;font-size:12px;padding:28px 10px;border-top:1px solid var(--line);margin-top:25px}
.success-card{max-width:620px;margin:36px auto;padding:30px 22px;text-align:center;border:1px solid var(--line);border-radius:18px;background:#fffafb;box-shadow:0 12px 34px rgba(112,43,73,.08)}.success-icon{width:58px;height:58px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:#e8f6ed;color:#16834a;font-size:30px;font-weight:800}.success-card h1{color:var(--wine);font:700 28px Georgia;margin:0 0 10px}.success-card p{color:#6f6268;line-height:1.7;margin:0 0 22px}.success-meta{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;margin:8px 0;border-radius:10px;background:white;border:1px solid var(--line);text-align:left}.success-meta span{color:#80747a}.success-meta strong{color:var(--wine);text-align:right;overflow-wrap:anywhere}.success-card .btn{margin-top:18px}
.viewer{position:fixed;inset:0;background:#090609f5;z-index:20;display:none;align-items:center;justify-content:center;padding:18px}.viewer.open{display:flex}.viewer img{max-width:100%;max-height:88vh;object-fit:contain}.viewer button{position:absolute;border:0;border-radius:50%;width:42px;height:42px;background:#ffffff22;color:#fff;font-size:25px;cursor:pointer}.close{top:18px;right:18px}.prev{left:14px;top:50%;transform:translateY(-50%)}.next{right:14px;top:50%;transform:translateY(-50%)}.viewer-count{position:absolute;bottom:20px;color:white;font-size:13px}
@media(min-width:720px){.wrap{padding:20px}.layout{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:30px}.name{font-size:32px}.card{padding:18px}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="top" id="announcement">সারা বাংলাদেশে Cash on Delivery</div>
<header class="nav"><a class="logo" href="/">Nora Libas</a><div style="display:flex;gap:8px"><a class="btn" href="/cart.html">Cart</a><a class="btn" href="/#products">Shop More</a></div></header>
<main class="wrap"><a class="back" href="/#products">← সব প্রোডাক্ট</a><div id="content"><div class="empty">প্রোডাক্ট লোড হচ্ছে...</div></div></main>
<footer class="footer">© 2026 Nora Libas. All Rights Reserved.</footer>
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Product image gallery"><button class="close" id="closeViewer" aria-label="Close">×</button><button class="prev" id="prevImage" aria-label="Previous image">‹</button><img id="viewerImage" alt="Product image"><button class="next" id="nextImage" aria-label="Next image">›</button><div class="viewer-count" id="viewerCount"></div></div>
<script>
let product=null,settings={},images=[],active=0,viewerHistoryPushed=false;
const $=id=>document.getElementById(id),money=n=>'৳ '+Number(n||0).toLocaleString('en-BD'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function galleryMarkup(){return '<div class="gallery"><div class="main-image-wrap"><img id="mainImage" class="main-image" src="'+esc(images[0]||'')+'" alt="'+esc(product.name)+'"><span class="image-count" id="imageCount">1 / '+images.length+'</span></div><div class="thumbs" id="thumbs">'+images.map((src,i)=>'<img class="thumb '+(i===0?'active':'')+'" src="'+esc(src)+'" alt="ছবি '+(i+1)+'" data-index="'+i+'">').join('')+'</div></div>'}
function optionsMarkup(){const colors=product.colors?.length?product.colors:['প্রযোজ্য নয়'];const sizes=product.sizes?.length?product.sizes:[{name:'Free Size',detail:''}];return '<form id="orderForm"><div class="grid"><div class="field"><label>Color</label><select name="color">'+colors.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select></div><div class="field"><label>Size</label><select name="size">'+sizes.map(x=>{const z=typeof x==='string'?{name:x,detail:''}:x;const label=z.detail?z.name+' — '+z.detail:z.name;return '<option value="'+esc(label)+'">'+esc(label)+'</option>'}).join('')+'</select></div><div class="field"><label>Quantity</label><input name="quantity" type="number" min="1" max="'+Math.max(1,Number(product.stock))+'" value="1" required></div><div class="field"><label>Delivery Area</label><select name="area" required><option value="" selected disabled>এলাকা নির্বাচন করুন</option><option value="inside">ঢাকার মধ্যে — '+money(settings.dhaka_delivery??120)+'</option><option value="outside">ঢাকার বাইরে — '+money(settings.outside_delivery??150)+'</option></select></div><div class="field"><label>আপনার নাম</label><input name="name" required maxlength="120" autocomplete="name"></div><div class="field"><label>মোবাইল নম্বর</label><input name="phone" type="tel" required inputmode="numeric" pattern="01[3-9][0-9]{8}" maxlength="11" minlength="11" placeholder="01XXXXXXXXX" autocomplete="tel"></div><div class="field full"><label>সম্পূর্ণ ঠিকানা</label><textarea name="address" required maxlength="1000" autocomplete="street-address" placeholder="থানা/উপজেলা, এলাকা, রোড ও বাড়ির নম্বর"></textarea></div></div><div class="total"><span>সর্বমোট (ডেলিভারিসহ)</span><span id="total">এলাকা নির্বাচন করুন</span></div><div class="actions"><button class="btn light" type="button" id="addToCart">Add to Cart</button><button class="btn" type="submit">Website Order Confirm</button><button class="btn whatsapp" type="button" id="whatsappOrder">WhatsApp Order</button></div></form>'}
function render(){if(!product){$('content').innerHTML='<div class="empty">প্রোডাক্টটি পাওয়া যায়নি। <br><a class="back" href="/">হোমপেজে ফিরে যান</a></div>';return}
images=(product.images||[]).filter(Boolean);$('content').innerHTML='<div class="layout">'+galleryMarkup()+'<section class="info"><h1 class="name">'+esc(product.name)+'</h1><div class="desc">'+esc(product.fabric||'')+(product.description?'\n'+esc(product.description):'')+'</div><div class="price">'+money(product.offerPrice)+' <span class="old">'+money(product.regularPrice)+'</span></div><div><span class="stock '+(Number(product.stock)>0?'in':'out')+'">'+(Number(product.stock)>0?'● স্টক আছে':'● স্টক শেষ')+'</span></div>'+(Number(product.stock)>0?'<div class="card">'+optionsMarkup()+'</div>':'<div class="card"><b class="stock out">এই মুহূর্তে পণ্যটি স্টকে নেই।</b></div>')+(product.videos||[]).map(v=>'<video controls playsinline preload="none" style="width:100%;max-height:350px;margin-top:14px"><source src="'+esc(v)+'" type="video/mp4"></video>').join('')+'</section></div>';
$('mainImage').onclick=openViewer;$('thumbs').onclick=e=>{const t=e.target.closest('[data-index]');if(t)setImage(Number(t.dataset.index))};
const f=$('orderForm');if(f){f.addEventListener('input',recalc);f.addEventListener('change',recalc);f.onsubmit=placeOrder;$('whatsappOrder').onclick=sendWhatsApp;$('addToCart').onclick=addToCart}
}
function setImage(i){if(!images.length)return;active=(i+images.length)%images.length;$('mainImage').src=images[active];$('imageCount').textContent=(active+1)+' / '+images.length;document.querySelectorAll('.thumb').forEach((el,n)=>el.classList.toggle('active',n===active));const t=document.querySelectorAll('.thumb')[active];if(t)t.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}
function openViewer(){if(!images.length)return;$('viewer').classList.add('open');document.body.style.overflow='hidden';if(!viewerHistoryPushed){history.pushState({nlImageViewer:true},'',location.href);viewerHistoryPushed=true}showViewerImage()}
function closeViewer(fromPop=false){if(!$('viewer').classList.contains('open'))return;$('viewer').classList.remove('open');document.body.style.overflow='';if(viewerHistoryPushed){viewerHistoryPushed=false;if(!fromPop&&history.state?.nlImageViewer)history.back()}}
window.addEventListener('popstate',()=>{if($('viewer').classList.contains('open'))closeViewer(true)});
function showViewerImage(){$('viewerImage').src=images[active];$('viewerCount').textContent=(active+1)+' / '+images.length}
function moveViewer(d){setImage(active+d);showViewerImage()}
$('closeViewer').onclick=closeViewer;$('prevImage').onclick=()=>moveViewer(-1);$('nextImage').onclick=()=>moveViewer(1);$('viewer').onclick=e=>{if(e.target===$('viewer'))closeViewer()};document.addEventListener('keydown',e=>{if(!$('viewer').classList.contains('open'))return;if(e.key==='Escape')closeViewer();if(e.key==='ArrowLeft')moveViewer(-1);if(e.key==='ArrowRight')moveViewer(1)});
let touchX=0; $('viewer').addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});$('viewer').addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-touchX;if(Math.abs(dx)>45)moveViewer(dx<0?1:-1)},{passive:true});
let startX=0;$('content').addEventListener('touchstart',e=>{startX=e.changedTouches[0].clientX},{passive:true});$('content').addEventListener('touchend',e=>{if(!$('viewer').classList.contains('open')&&images.length>1){const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>65)setImage(active+(dx<0?1:-1))}},{passive:true});
function formValues(){const f=$('orderForm'),v=n=>f.elements.namedItem(n);return {color:v('color').value,size:v('size').value,quantity:Number(v('quantity').value),area:v('area').value,name:v('name').value.trim(),phone:v('phone').value.trim(),address:v('address').value.trim()}}
function addToCart(){const f=$('orderForm');if(!f)return;const d=formValues();if(!Number.isInteger(d.quantity)||d.quantity<1||d.quantity>product.stock){alert('স্টকে পর্যাপ্ত পণ্য নেই।');return}try{const key='noraLibasCart',cart=JSON.parse(localStorage.getItem(key)||'[]'),found=cart.find(x=>x.productId===product.id&&x.color===d.color&&x.size===d.size);if(found)found.quantity+=d.quantity;else cart.push({productId:product.id,color:d.color,size:d.size,quantity:d.quantity});localStorage.setItem(key,JSON.stringify(cart));alert('পণ্যটি Cart-এ যোগ হয়েছে।')}catch{alert('Cart সংরক্ষণ করা যায়নি। Browser storage চালু আছে কি না দেখুন।')}}
function deliveryFee(area){return area==='inside'?Number(settings.dhaka_delivery??120):area==='outside'?Number(settings.outside_delivery??150):null}
function recalc(){const f=$('orderForm');if(!f)return;const d=formValues(),fee=deliveryFee(d.area);$('total').textContent=fee===null?'এলাকা নির্বাচন করুন':money(product.offerPrice*d.quantity+fee)}
function validate(d){if(!['inside','outside'].includes(d.area)){alert('ডেলিভারি এলাকা নির্বাচন করুন।');return false}if(!/^01[3-9][0-9]{8}$/.test(d.phone)){alert('সঠিক ১১ ডিজিটের বাংলাদেশি মোবাইল নম্বর দিন।');return false}if(!d.name||!d.address){alert('নাম ও সম্পূর্ণ ঠিকানা পূরণ করুন।');return false}if(!Number.isInteger(d.quantity)||d.quantity<1||d.quantity>product.stock){alert('স্টকে পর্যাপ্ত পণ্য নেই।');return false}return true}
function showOrderSuccess(orderId,total){$('content').innerHTML='<section class="success-card" role="status" aria-live="polite"><div class="success-icon">✓</div><h1>Thank you for your order!</h1><p>Thank you for shopping with Nora Libas.<br>আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে।</p><div class="success-meta"><span>Order ID</span><strong>'+esc(orderId)+'</strong></div><div class="success-meta"><span>Total</span><strong>'+money(total)+'</strong></div><a class="btn" href="/">Continue Shopping</a></section>'}
async function placeOrder(e){e.preventDefault();const f=$('orderForm'),d=formValues();if(!f.reportValidity()||!validate(d))return;const btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='অর্ডার জমা হচ্ছে...';try{const r=await fetch('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({productId:product.id,...d})}),v=await r.json();if(!r.ok)throw Error(v.error||'অর্ডার নেওয়া যায়নি');showOrderSuccess(v.orderId,v.total)}catch(err){alert(err.message);btn.disabled=false;btn.textContent='Website Order Confirm'}}
function sendWhatsApp(){const d=formValues();if(!validate(d))return;const wa=String(settings.whatsapp||'').replace(/\D/g,'');if(!wa){alert('দোকানের WhatsApp নম্বর Owner Panel-এর Site Settings থেকে সেট করতে হবে।');return}const total=product.offerPrice*d.quantity+deliveryFee(d.area),msg='Nora Libas Order\nProduct: '+product.name+'\nColor: '+d.color+'\nSize: '+d.size+'\nQuantity: '+d.quantity+'\nTotal: '+money(total)+'\nName: '+d.name+'\nPhone: '+d.phone+'\nAddress: '+d.address;window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(msg),'_blank','noopener')}
async function start(){const id=new URLSearchParams(location.search).get('id');if(!id){$('content').innerHTML='<div class="empty">প্রোডাক্টের লিংক সঠিক নয়। <a class="back" href="/">হোমপেজে যান</a></div>';return}try{const [a,b]=await Promise.all([fetch('/api/products'),fetch('/api/settings')]);if(!a.ok||!b.ok)throw Error('তথ্য লোড করা যায়নি');const pd=await a.json(),sd=await b.json();product=(pd.products||[]).find(p=>p.id===id)||null;settings=sd.settings||{};if(settings.announcement)$('announcement').textContent=settings.announcement;document.title=(product?.name||'Product')+' | Nora Libas';render()}catch(e){$('content').innerHTML='<div class="empty">প্রোডাক্ট লোড করা যাচ্ছে না। কিছুক্ষণ পর আবার চেষ্টা করুন।</div>'}}
start();
</script>
</body></html>
