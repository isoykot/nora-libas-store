<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#702b49"><meta name="description" content="Nora Libas — আপনার পছন্দের পোশাক।"><title>Nora Libas | Fashion</title><style>
:root{--wine:#702b49;--soft:#fff7f8;--line:#f0e5e9}*{box-sizing:border-box}body{margin:0;color:#30252a;background:#fff;font-family:system-ui,"Noto Sans Bengali",sans-serif;-webkit-font-smoothing:antialiased}.top{background:var(--wine);color:white;text-align:center;padding:8px 10px;font-size:12px}.nav{height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff}.logo{font:700 24px Georgia;color:var(--wine)}.logo small{display:none}.wrap{max-width:980px;margin:auto;padding:14px}.hero{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(125deg,#4d172f 0%,#702b49 48%,#a94472 100%);color:white;border-radius:24px;padding:clamp(28px,5vw,54px);margin:14px 0 26px;min-height:330px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;box-shadow:0 18px 42px rgba(112,43,73,.18)}.hero::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 82% 28%,rgba(255,214,231,.24),transparent 23%),radial-gradient(circle at 75% 85%,rgba(255,255,255,.10),transparent 26%)}.hero::after{content:"";position:absolute;right:-125px;top:-155px;width:390px;height:390px;border:1px solid rgba(255,255,255,.16);border-radius:50%;box-shadow:0 0 0 26px rgba(255,255,255,.035),0 0 0 68px rgba(255,255,255,.025);pointer-events:none}.hero-art{position:absolute;right:6%;top:50%;transform:translateY(-50%);width:28%;height:205px;z-index:1;display:grid;place-items:center;pointer-events:none}.hero-art::before{content:"";position:absolute;width:145px;height:178px;border-radius:48% 48% 22px 22px;background:linear-gradient(145deg,rgba(255,245,249,.24),rgba(255,235,243,.08));border:1px solid rgba(255,245,249,.26);box-shadow:0 10px 24px rgba(28,4,18,.06);transform:rotate(8deg)}.hero-art::after{content:"";position:absolute;width:165px;height:165px;border:1px solid rgba(255,240,246,.23);border-radius:50%;transform:translate(16px,-5px)}.hero-art .art-label{position:relative;z-index:2;color:#ffeaf1;opacity:.76;font:italic 21px/1.05 Georgia,serif;letter-spacing:2px;text-align:center;text-shadow:0 1px 4px rgba(30,4,18,.05);transform:rotate(-8deg)}.hero-art .art-label b{font-size:11px;letter-spacing:5px;font-style:normal}.hero>:not(.hero-art){position:relative;z-index:2;max-width:56%}.hero h1,.hero p{text-shadow:0 1px 12px rgba(40,12,25,.18)}.promo-banner{display:none;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;background:#fff0f5;border:1px solid #f0d4df;color:#702b49;border-radius:12px;padding:10px 12px;margin:0 0 13px;text-align:center;font-size:13px}.promo-banner.active{display:flex}.promo-banner strong{background:#702b49;color:white;padding:4px 9px;border-radius:20px;font-size:11px;letter-spacing:.5px}.social-links{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:9px}.social-links a{color:#702b49;text-decoration:none;font-weight:700}.hero h1{font:30px Georgia;margin:0 0 9px}.hero p{font-size:14px;line-height:1.65;margin:0 0 16px}.btn{display:inline-flex;justify-content:center;align-items:center;border:0;border-radius:25px;background:var(--wine);color:white;text-decoration:none;font-weight:700;padding:12px 18px;min-height:44px;cursor:pointer}.btn.light{background:white;color:var(--wine)}.section-title{font:26px Georgia;color:var(--wine);margin:20px 2px 13px}.products{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:white;box-shadow:0 4px 13px rgba(70,30,48,.035);transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(70,30,48,.10)}.product-row{display:flex;flex-direction:column;gap:0}.product-link{display:block;min-width:0;overflow:hidden;background:#fbf3f6;aspect-ratio:4/4.6}.photo{display:block;width:100%;height:100%;min-height:0;max-height:none;object-fit:cover;background:#f8f1f3;transition:transform .45s}.card:hover .photo{transform:scale(1.035)}.product-title-link{color:inherit;text-decoration:none}.product-title-link:hover{color:var(--wine)}.info{padding:9px;align-self:stretch}.info>.btn{width:100%;margin-top:3px;min-height:36px;padding:8px 10px;font-size:12px}.info h3{font-size:13px;line-height:1.3;margin:0 0 4px}.muted{color:#80747a;font-size:12px;line-height:1.5}.stock-badge{display:inline-block;margin:3px 0 8px;font-size:12px;font-weight:800;letter-spacing:.1px}.stock-badge.in-stock{color:#16834a}.stock-badge.out-stock{color:#c62828;text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#c62828}.price{color:var(--wine);font-weight:800;font-size:16px;margin:6px 0}.old{font-size:12px;color:#9b9296;text-decoration:line-through;font-weight:400;margin-left:5px}.empty{text-align:center;padding:30px;color:#777}.footer{text-align:center;color:#82757c;font-size:12px;padding:28px 10px;border-top:1px solid var(--line);margin-top:25px}.hide{display:none!important}.note{font-size:11px;color:#81757a;margin:8px 0 0}@media(min-width:700px){.wrap{padding:20px}.hero{padding:40px;min-height:340px}.hero h1{font-size:42px}.hero-art{right:7%;height:225px}.products{grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.info{padding:11px}.info h3{font-size:14px}.price{font-size:16px}}@media(min-width:1024px){.products{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:699px){.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.card{border-radius:12px}.product-link{aspect-ratio:1/1}.info{padding:7px 8px}.info h3{font-size:12px;line-height:1.25;margin:0 0 3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}.price{font-size:14px;margin:4px 0}.old{font-size:10px}.info>.btn{min-height:31px;padding:6px 7px;font-size:11px;gap:5px;margin-top:2px}.info>.btn svg{width:13px;height:13px}.section-title{font-size:21px;margin:15px 2px 9px}.hero{min-height:245px;padding:24px 18px;justify-content:center}.hero>:not(.hero-art){max-width:62%}.hero h1{font-size:clamp(22px,6vw,29px);line-height:1.08;margin:0 0 9px}.hero p{font-size:clamp(11px,3vw,13px);line-height:1.5;max-width:58%;margin:0 0 12px}.hero .btn.light{font-size:12px;padding:9px 13px;min-height:36px}.hero-art{right:2%;width:33%;height:145px}.hero-art::before{width:95px;height:125px}.hero-art::after{width:115px;height:115px;transform:translate(10px,-4px)}.hero-art .art-label{font-size:14px;letter-spacing:1.5px}.hero-art .art-label b{font-size:8px;letter-spacing:3px}}@media(min-width:460px) and (max-width:699px){.products{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.info{padding:6px}.info h3{font-size:11px;min-height:27px}.price{font-size:13px}.info>.btn{font-size:10px;min-height:29px;padding:5px 4px}.info>.btn svg{width:12px;height:12px}}@media(max-width:360px){.hero{min-height:225px;padding:21px 14px}.hero>:not(.hero-art){max-width:65%}.hero-art{right:0;width:36%}.products{gap:7px}.product-link{aspect-ratio:1/1}.info{padding:6px}.info h3{font-size:11px;min-height:27px}.price{font-size:13px}.info>.btn{font-size:10px;min-height:29px;padding:5px 4px}.btn{padding:10px 12px;font-size:13px}}</style></head><body><div class="top" id="announcement">সারা বাংলাদেশে Cash on Delivery</div><header class="nav"><div class="logo"><span id="storeName">Nora Libas</span></div><div style="display:flex;gap:8px"><a class="btn light" href="/cart.html">Cart</a><a class="btn" href="#products">Shop Now</a></div></header><main class="wrap"><div id="promoBanner" class="promo-banner"><span id="promoText"></span><strong id="promoCode" class="hide"></strong></div><section class="hero"><h1 id="heroTitle">Elegance in Every Thread</h1><p id="heroText">আপনার পছন্দের পোশাক, এখন আরও সহজে অর্ডার করুন।</p><a class="btn light" href="#products">কালেকশন দেখুন</a><div class="hero-art" aria-hidden="true"><span class="art-label">NORA<br><b>LIBAS</b></span></div></section><h2 class="section-title" id="collectionTitle">Our Collection</h2><section id="products" class="products"><div class="empty">প্রোডাক্ট লোড হচ্ছে...</div></section></main><footer class="footer">© 2026 Nora Libas. All Rights Reserved.<div id="socialLinks" class="social-links"></div></footer><script>
let products=[],settings={};const $=id=>document.getElementById(id),money=n=>'৳ '+Number(n||0).toLocaleString('en-BD'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function start(){try{const [a,b]=await Promise.all([fetch('/api/products'),fetch('/api/settings')]);const pd=await a.json(),sd=await b.json();products=pd.products||[];settings=sd.settings||{};for(const [id,key] of [['announcement','announcement'],['storeName','store_name'],['heroTitle','hero_title'],['heroText','hero_text']])if(settings[key])$(id).textContent=settings[key];if(settings.promo_enabled==='1'&&settings.promo_text){$('promoBanner').classList.add('active');$('promoText').textContent=settings.promo_text;if(settings.promo_code){$('promoCode').textContent=settings.promo_code;$('promoCode').classList.remove('hide')}}const socials=[['Facebook',settings.facebook_url],['Instagram',settings.instagram_url],['TikTok',settings.tiktok_url]];$('socialLinks').innerHTML=socials.filter(x=>/^https:\/\//i.test(x[1]||'')).map(x=>'<a href="'+esc(x[1])+'" target="_blank" rel="noopener noreferrer">'+x[0]+'</a>').join('');render()}catch{$('products').innerHTML='<div class="empty">এই মুহূর্তে প্রোডাক্ট লোড করা যাচ্ছে না। কিছুক্ষণ পর আবার চেষ্টা করুন।</div>'}}
function render(){if(!products.length){$('products').innerHTML='<div class="empty">নতুন কালেকশন খুব শিগগিরই আসছে।</div>';return}$('products').innerHTML=products.map(p=>`<article class="card"><div class="product-row"><a class="product-link" href="product.html?id=${encodeURIComponent(p.id)}" aria-label="${esc(p.name)} বিস্তারিত দেখুন"><img class="photo" loading="lazy" decoding="async" src="${esc(p.images[0]||'')}" alt="${esc(p.name)}"></a><div class="info"><h3><a class="product-title-link" href="product.html?id=${encodeURIComponent(p.id)}">${esc(p.name)}</a></h3><div class="price">${money(p.offerPrice)} <span class="old">${money(p.regularPrice)}</span></div><a class="btn" href="product.html?id=${encodeURIComponent(p.id)}" aria-label="${esc(p.name)} বিস্তারিত দেখে অর্ডার করুন" ${Number(p.stock)>0?"":"aria-disabled=\"true\" tabindex=\"-1\" style=\"opacity:.5;pointer-events:none\""}><svg viewBox="0 0 24 24" aria-hidden="true" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M6 8h12l1 12H5L6 8Z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg> ${Number(p.stock)>0?"Order Now":"স্টক শেষ"}</a></div></div>${(p.videos||[]).map(v=>`<video class="product-video" controls playsinline preload="none" style="width:100%;max-height:360px;object-fit:contain"><source src="${esc(v)}" type="video/mp4"></video>`).join('')}</article>`).join('')}
start();</script></body></html>
