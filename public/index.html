<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#702b49"><meta name="description" content="Nora Libas — আপনার পছন্দের পোশাক।"><title>Nora Libas | Fashion</title><style>
:root{--wine:#702b49;--soft:#fff7f8;--line:#f0e5e9}*{box-sizing:border-box}body{margin:0;color:#30252a;background:#fff;font-family:system-ui,"Noto Sans Bengali",sans-serif;-webkit-font-smoothing:antialiased}.top{background:var(--wine);color:white;text-align:center;padding:8px 10px;font-size:12px}.nav{height:64px;padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#fff}.logo{font:700 24px Georgia;color:var(--wine)}.logo small{display:none}.wrap{max-width:980px;margin:auto;padding:14px}.hero{position:relative;isolation:isolate;overflow:hidden;background:#702b49;color:white;border-radius:15px;padding:25px 20px;margin:14px 0 25px;min-height:320px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.hero::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(120deg,rgba(112,43,73,.58),rgba(185,121,145,.52))}.hero-banner{position:absolute;z-index:0;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:center;border-radius:0;margin:0;opacity:1;box-shadow:none}.hero>:not(.hero-banner){position:relative;z-index:2}.hero h1,.hero p{text-shadow:0 1px 12px rgba(40,12,25,.18)}.hero h1{font:30px Georgia;margin:0 0 9px}.hero p{font-size:14px;line-height:1.65;margin:0 0 16px}.btn{display:inline-flex;justify-content:center;align-items:center;border:0;border-radius:25px;background:var(--wine);color:white;text-decoration:none;font-weight:700;padding:12px 18px;min-height:44px;cursor:pointer}.btn.light{background:white;color:var(--wine)}.section-title{font:26px Georgia;color:var(--wine);margin:20px 2px 13px}.products{display:grid;gap:13px}.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:white}.product-row{display:grid;grid-template-columns:42% 1fr;gap:0}.product-link{display:block;min-width:0}.photo{width:100%;height:100%;min-height:190px;max-height:270px;object-fit:cover;background:#f8f1f3}.product-title-link{color:inherit;text-decoration:none}.product-title-link:hover{color:var(--wine)}.info{padding:13px 12px;align-self:center}.info h3{font-size:15px;line-height:1.4;margin:0 0 6px}.muted{color:#80747a;font-size:12px;line-height:1.5}.stock-badge{display:inline-block;margin:3px 0 8px;font-size:12px;font-weight:800;letter-spacing:.1px}.stock-badge.in-stock{color:#16834a}.stock-badge.out-stock{color:#c62828;text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:#c62828}.price{color:var(--wine);font-weight:800;font-size:19px;margin:8px 0}.old{font-size:12px;color:#9b9296;text-decoration:line-through;font-weight:400;margin-left:5px}.options{border-top:1px solid var(--line);padding:13px;background:#fffafb}.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;min-height:42px;border:1px solid #e5d9de;border-radius:9px;padding:10px;font:inherit;font-size:14px;background:#fff}.field textarea{min-height:66px;resize:vertical}.field.full{grid-column:1/-1}.total{display:flex;justify-content:space-between;background:#fbedf1;color:var(--wine);padding:11px;border-radius:9px;font-weight:800;margin:11px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1}.btn.whatsapp{background:#16834a}.thumbs{display:flex;gap:6px;overflow:auto;margin:7px 0}.thumbs img{width:48px;height:58px;object-fit:cover;border-radius:6px;border:2px solid transparent}.thumbs img.active{border-color:var(--wine)}.empty{text-align:center;padding:30px;color:#777}.footer{text-align:center;color:#82757c;font-size:12px;padding:28px 10px;border-top:1px solid var(--line);margin-top:25px}.hide{display:none!important}.note{font-size:11px;color:#81757a;margin:8px 0 0}@media(min-width:700px){.wrap{padding:20px}.hero{padding:40px;min-height:330px}.hero h1{font-size:42px}.products{gap:16px}.product-row{grid-template-columns:34% 1fr}.photo{max-height:310px}.info{padding:22px}.info h3{font-size:19px}.options{padding:18px}.options-grid{grid-template-columns:repeat(4,1fr)}.field.full{grid-column:span 2}}@media(max-width:699px){.hero{aspect-ratio:3/2;min-height:0;height:auto;padding:clamp(12px,3.5vw,18px);justify-content:flex-start}.hero-banner{inset:0;width:100%;height:100%;object-fit:cover;object-position:100% center}.hero h1{font-size:clamp(17px,5vw,21px);line-height:1.08;max-width:54%;margin:0 0 6px}.hero p{font-size:clamp(10px,2.8vw,12px);line-height:1.35;max-width:48%;margin:0 0 8px}.hero .btn.light{font-size:clamp(10px,2.8vw,12px);padding:7px 12px;min-height:32px}}@media(max-width:360px){.product-row{grid-template-columns:40% 1fr}.photo{min-height:175px}.info{padding:9px}.btn{padding:10px 12px;font-size:13px}}
</style></head><body><div class="top" id="announcement">সারা বাংলাদেশে Cash on Delivery</div><header class="nav"><div class="logo"><span id="storeName">Nora Libas</span></div><a class="btn" href="#products">Shop Now</a></header><main class="wrap"><section class="hero"><h1 id="heroTitle">Elegance in Every Thread</h1><p id="heroText">আপনার পছন্দের পোশাক, এখন আরও সহজে অর্ডার করুন।</p><a class="btn light" href="#products">কালেকশন দেখুন</a><img class="hero-banner" src="/fashion-banner.png" alt="Nora Libas Premium Fashion Collection"></section><h2 class="section-title" id="collectionTitle">Our Collection</h2><section id="products" class="products"><div class="empty">প্রোডাক্ট লোড হচ্ছে...</div></section></main><footer class="footer">© 2026 Nora Libas. All Rights Reserved.</footer><script>
let products=[],settings={};const $=id=>document.getElementById(id),money=n=>'৳ '+Number(n||0).toLocaleString('en-BD'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function start(){try{const [a,b]=await Promise.all([fetch('/api/products'),fetch('/api/settings')]);const pd=await a.json(),sd=await b.json();products=pd.products||[];settings=sd.settings||{};for(const [id,key] of [['announcement','announcement'],['storeName','store_name'],['heroTitle','hero_title'],['heroText','hero_text']])if(settings[key])$(id).textContent=settings[key];render()}catch{$('products').innerHTML='<div class="empty">এই মুহূর্তে প্রোডাক্ট লোড করা যাচ্ছে না। কিছুক্ষণ পর আবার চেষ্টা করুন।</div>'}}
function render(){if(!products.length){$('products').innerHTML='<div class="empty">নতুন কালেকশন খুব শিগগিরই আসছে।</div>';return}$('products').innerHTML=products.map(p=>`<article class="card"><div class="product-row"><a class="product-link" href="product.html?id=${encodeURIComponent(p.id)}" aria-label="${esc(p.name)} বিস্তারিত দেখুন"><img class="photo" loading="lazy" decoding="async" src="${esc(p.images[0]||'')}" alt="${esc(p.name)}"></a><div class="info"><h3><a class="product-title-link" href="product.html?id=${encodeURIComponent(p.id)}">${esc(p.name)}</a></h3><div class="muted">${esc(p.fabric||p.description||'')}</div><div class="price">${money(p.offerPrice)} <span class="old">${money(p.regularPrice)}</span></div><div class="muted">${Number(p.stock)>0?'<span class="stock-badge in-stock">স্টক আছে</span>':'<span class="stock-badge out-stock">স্টক নেই</span>'}</div><a class="btn" href="product.html?id=${encodeURIComponent(p.id)}" aria-label="${esc(p.name)} বিস্তারিত দেখে অর্ডার করুন" ${Number(p.stock)>0?"":"aria-disabled=\"true\" tabindex=\"-1\" style=\"opacity:.5;pointer-events:none\""}>${Number(p.stock)>0?"অর্ডার করুন":"স্টক শেষ"}</a></div></div>${(p.videos||[]).map(v=>`<video class="product-video" controls playsinline preload="none" style="width:100%;max-height:360px;object-fit:contain"><source src="${esc(v)}" type="video/mp4"></video>`).join('')}<div id="order-${p.id}" class="options hide">${orderForm(p)}</div></article>`).join('')}
function orderForm(p){return `<form onsubmit="placeOrder(event,'${p.id}')"><div class="options-grid"><div class="field"><label>Color</label><select name="color">${(p.colors.length?p.colors:['প্রযোজ্য নয়']).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Size</label><select name="size">${(p.sizes.length?p.sizes:[{name:'Free Size',detail:''}]).map(x=>{const z=typeof x==='string'?{name:x,detail:''}:x,label=z.detail?`${z.name} — ${z.detail}`:z.name;return `<option value="${esc(label)}">${esc(label)}</option>`}).join('')}</select></div><div class="field"><label>Quantity</label><input name="quantity" type="number" min="1" max="${Math.max(1,p.stock)}" value="1" required oninput="recalc('${p.id}')"></div><div class="field"><label>Delivery Area</label><select name="area" required onchange="recalc('${p.id}')"><option value="" selected disabled>ডেলিভারি এলাকা নির্বাচন করুন</option><option value="inside">ঢাকার মধ্যে — ৳${Number(settings.dhaka_delivery??120)}</option><option value="outside">ঢাকার বাইরে — ৳${Number(settings.outside_delivery??150)}</option></select></div><div class="field"><label>আপনার নাম</label><input name="name" required maxlength="120" autocomplete="name"></div><div class="field"><label>মোবাইল নম্বর</label><input name="phone" type="tel" required inputmode="numeric" pattern="01[3-9][0-9]{8}" maxlength="11" minlength="11" autocomplete="tel" placeholder="01XXXXXXXXX" title="১১ ডিজিটের বাংলাদেশি নম্বর লিখুন, 01 দিয়ে শুরু হবে।"></div><div class="field full"><label>সম্পূর্ণ ঠিকানা</label><textarea name="address" required autocomplete="street-address" placeholder="থানা/উপজেলা, এলাকা, রোড নম্বর, বাড়ির নাম বা নম্বর লিখুন"></textarea></div></div><div class="total"><span>সর্বমোট (ডেলিভারিসহ)</span><span id="total-${p.id}">এলাকা নির্বাচন করুন</span></div><div class="actions"><button class="btn" type="submit">Website Order Confirm</button><button class="btn whatsapp" type="button" onclick="whatsappOrder('${p.id}',this)">WhatsApp Order</button></div></form>`}
function toggleOrder(id){const el=$('order-'+id);el.classList.toggle('hide');if(!el.classList.contains('hide'))el.scrollIntoView({behavior:'smooth',block:'nearest'})}
function recalc(id){const p=products.find(x=>x.id===id),f=$('order-'+id).querySelector('form'),q=Math.max(1,Number(f.quantity.value)||1),fee=f.area.value==='inside'?Number(settings.dhaka_delivery??120):f.area.value==='outside'?Number(settings.outside_delivery??150):null;$('total-'+id).textContent=fee===null?'ডেলিভারি এলাকা নির্বাচন করুন':money(p.offerPrice*q+fee)}
function formData(id){const p=products.find(x=>x.id===id),f=$('order-'+id).querySelector('form');return {product:p,form:f,data:{productId:id,color:f.color.value,size:f.size.value,quantity:Number(f.quantity.value),area:f.area.value,name:f.name.value.trim(),phone:f.phone.value.trim(),address:f.address.value.trim()}}}
async function placeOrder(e,id){e.preventDefault();const {product:p,form:f,data:d}=formData(id),btn=f.querySelector('button[type=submit]');if(!['inside','outside'].includes(d.area)){alert('Delivery Area নির্বাচন করা হয়নি। অর্ডার করতে হলে ঢাকার মধ্যে (৳120) অথবা ঢাকার বাইরে (৳150)—একটি নির্বাচন করুন।');f.area.focus();return}if(!/^01[3-9][0-9]{8}$/.test(d.phone)){alert('সঠিক ১১ ডিজিটের বাংলাদেশি মোবাইল নম্বর দিন (01 দিয়ে শুরু)।');f.phone.focus();return}if(d.quantity>p.stock){alert('স্টকে পর্যাপ্ত পণ্য নেই।');return}btn.disabled=true;btn.textContent='অর্ডার জমা হচ্ছে...';try{const r=await fetch('/api/orders',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(d)}),v=await r.json();if(!r.ok)throw Error(v.error||'অর্ডার নেওয়া যায়নি');alert('আপনার অর্ডারটি গ্রহণ করা হয়েছে। Order ID: '+v.orderId+'\nমোট: '+money(v.total));f.reset();await start()}catch(err){alert(err.message)}finally{btn.disabled=false;btn.textContent='Website Order Confirm'}}
function focArea(id){$('order-'+id).querySelector('[name=area]').focus()}
function whatsappOrder(id,btn){const {product:p,data:d}=formData(id);const wa=String(settings.whatsapp||'').replace(/\D/g,'');if(!wa){alert('দোকানের WhatsApp নম্বর Owner Panel-এর Site Settings থেকে সেট করতে হবে।');return}if(!['inside','outside'].includes(d.area)){alert('Delivery Area নির্বাচন করুন: ঢাকার মধ্যে অথবা ঢাকার বাইরে।');focArea(id);return}if(!d.name||!d.phone||!d.address){alert('নাম, মোবাইল ও ঠিকানা পূরণ করুন।');return}if(!/^01[3-9][0-9]{8}$/.test(d.phone)){alert('সঠিক ১১ ডিজিটের বাংলাদেশি মোবাইল নম্বর দিন (01 দিয়ে শুরু)।');return}const fee=d.area==='inside'?Number(settings.dhaka_delivery??120):Number(settings.outside_delivery??150),total=p.offerPrice*d.quantity+fee,msg=`Nora Libas Order\nProduct: ${p.name}\nColor: ${d.color}\nSize: ${d.size}\nQuantity: ${d.quantity}\nTotal: ${money(total)}\nName: ${d.name}\nPhone: ${d.phone}\nAddress: ${d.address}`;window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(msg),'_blank','noopener')}
start();</script></body></html>
